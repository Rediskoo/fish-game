services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aquarium
      POSTGRES_PASSWORD: aquarium
      POSTGRES_DB: aquarium
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquarium -d aquarium"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
