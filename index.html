<!DOCTYPE html>
<html>
<head>
  <title>🐟 Аквариум</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script defer src="app.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: linear-gradient(to bottom, #4fc3f7, #01579b);
      font-family: Arial;
    }

    #aquarium {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    #fish {
      position: absolute;
      width: 60px;
      transition: left 1s linear, top 1s linear;
    }

    /* кнопка снизу */
    #btn {
      position: absolute;
      bottom: 15px;
      left: 15px;
      right: 15px;
      z-index: 10;
    }

    #btn button {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: white;
      font-size: 16px;
    }

    /* окно жителей */
    #panel {
      display: none;
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(10px);
      padding: 12px;
      border-radius: 14px;
      z-index: 20;
    }
  </style>
</head>

<body>

<div id="aquarium">

  <!-- окно -->
  <div id="panel"></div>

  <!-- кнопка -->
  <div id="btn">
    <button onclick="toggleResidents()">👥 Жители</button>
  </div>

</div>

</body>
</html>
