<!DOCTYPE html>
<html>
<head>
  <title>🐟 Аквариум</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script defer src="app.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial;
      background: linear-gradient(to bottom, #4fc3f7, #01579b);
    }

    #aquarium {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    #top {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      z-index: 10;
    }

    #bottom {
      position: absolute;
      bottom: 15px;
      left: 15px;
      right: 15px;
      z-index: 10;
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      margin-top: 5px;
    }
  </style>
</head>

<body>
  <div id="aquarium"></div>
</body>
</html>
