<!DOCTYPE html>
<html>
<head>
  <title>🐟 Аквариум</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script defer src="app.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: linear-gradient(to bottom, #4fc3f7, #01579b);
      font-family: Arial;
    }

    #aquarium {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    /* рыбка + имя */
    .fish {
      position: absolute;
      width: 50px;
      transition: left 1s linear, top 1s linear;
      text-align: center;
    }

    .fish-name {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      color: white;
      text-shadow: 0 0 3px black;
      pointer-events: none;
    }

    /* ПАНЕЛЬ ЖИТЕЛЕЙ */
    #panel {
      display: none;
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;

      background: rgba(255,255,255,0.65);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 12px;
      z-index: 20;
    }

    /* НИЖНИЕ КНОПКИ */
    #bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;

      display: flex;
      z-index: 30;
    }

    .btn {
      flex: 1;
      padding: 14px;
      border: none;
      font-size: 14px;
      background: rgba(255,255,255,0.9);
    }

    .btn:active {
      background: rgba(255,255,255,1);
    }
  </style>
</head>

<body>

<div id="aquarium">

  <div id="panel"></div>

  <div id="bottom">
    <button class="btn" onclick="toggleResidents()">👥 Жители</button>
    <button class="btn" onclick="collectAlgae()">🌿 Водоросли (<span id="algaeCount">0</span>)</button>
  </div>

</div>

</body>
</html>
