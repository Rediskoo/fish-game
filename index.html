<!DOCTYPE html>
<html>
<head>
  <title>🐟 Аквариум</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script defer src="app.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: linear-gradient(to bottom, #4fc3f7, #01579b);
    }

    #aquarium {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    #fish {
      position: absolute;
      width: 80px;
      transition: left 1s linear, top 1s linear;
    }

    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-family: Arial;
      z-index: 10;
    }
  </style>
</head>

<body>
  <div id="aquarium">
    
    <div id="ui">
      <input id="name" placeholder="Имя рыбки">
      <button onclick="createFish()">Создать</button>
      <button onclick="feed()">Кормить 🍎</button>
      <p id="info"></p>
    </div>

    <!-- рыбка -->
    <img id="fish" src="https://i.imgur.com/4AiXzf8.png">
    
  </div>
</body>
</html>
